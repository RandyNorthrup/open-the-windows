# Continuous integration for Open the Windows.
#
# Two jobs:
#   quality-windows  builds, tests (with coverage thresholds), formats, and runs the
#                    Windows-only gates on windows-latest (windows-2025, runs as admin).
#   sast-linux       secret scanning (full history), semgrep, copy-paste and markdown lint
#                    on ubuntu-latest — none of these need Windows and it keeps the
#                    Windows job short.
#
# The same gates run locally via `pwsh build/quality.ps1`; CI adds locked restore.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: true
  CI: true

jobs:
  quality-windows:
    name: Build, test, gates (Windows)
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Set up .NET (from global.json)
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json
          cache: true
          cache-dependency-path: '**/packages.lock.json'

      - name: Set up Node (repo tooling)
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm

      - name: Install repo tooling
        run: npm ci --no-fund --no-audit --loglevel=error

      - name: Restore (locked mode, NuGetAudit as errors)
        run: dotnet restore OpenTheWindows.slnx --locked-mode

      - name: Restore dotnet tools
        run: dotnet tool restore

      - name: Format (verify only)
        run: dotnet format OpenTheWindows.slnx --verify-no-changes --no-restore

      - name: Build (Release, warnings as errors, analyzers)
        run: dotnet build OpenTheWindows.slnx -c Release --no-restore

      - name: Test with coverage
        run: >
          dotnet test OpenTheWindows.slnx -c Release --no-build
          --coverage --coverage-output-format cobertura --results-directory artifacts/coverage

      - name: Coverage thresholds
        # Bare "minimumCoverageThresholds:..." tokens are the syntax ReportGenerator enforces;
        # "-settings:..." forms are silently ignored (verified 2026-08-16).
        run: >
          dotnet reportgenerator
          "-reports:artifacts/coverage/**/*.cobertura.xml"
          "-targetdir:artifacts/coverage/report"
          "-reporttypes:TextSummary;Cobertura;MarkdownSummaryGithub"
          "-assemblyfilters:-*.Tests;-OpenTheWindows.TestSupport"
          "-filefilters:-*.g.cs;-*.g.i.cs"
          "-verbosity:Warning"
          "minimumCoverageThresholds:lineCoverage=85"
          "minimumCoverageThresholds:branchCoverage=75"

      - name: Coverage summary
        if: always()
        shell: pwsh
        run: |
          if (Test-Path artifacts/coverage/report/SummaryGithub.md) {
            Get-Content artifacts/coverage/report/SummaryGithub.md | Out-File -Append -Encoding utf8 $env:GITHUB_STEP_SUMMARY
          }

      - name: PSScriptAnalyzer
        shell: pwsh
        run: |
          Install-Module PSScriptAnalyzer -RequiredVersion 1.25.0 -Scope CurrentUser -Force -AcceptLicense
          $records = @(Invoke-ScriptAnalyzer -Path build -Recurse -Settings ./PSScriptAnalyzerSettings.psd1)
          if ($records.Count -gt 0) { $records | Format-Table -AutoSize | Out-String | Write-Host; exit 1 }

      - name: Plan / spec / certification consistency
        run: pwsh build/check-plan.ps1

      - name: Publish (win-x64, smoke)
        run: pwsh build/publish.ps1 -Runtime win-x64

      - name: CLI smoke on runner
        run: |
          artifacts/publish/win-x64/cli/otw.exe --version
          artifacts/publish/win-x64/cli/otw.exe doctor --json

      - name: Upload coverage report
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: coverage-report
          path: artifacts/coverage/report
          retention-days: 14

      - name: Upload publish output
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: publish-win-x64
          path: |
            artifacts/publish/*.zip
            artifacts/publish/SHA256SUMS.txt
            artifacts/publish/sbom.cdx.json
          retention-days: 14

  sast-linux:
    name: Secrets, SAST, duplication, markdown (Linux)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout (full history for gitleaks)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm

      - name: Install repo tooling
        run: npm ci --no-fund --no-audit --loglevel=error

      - name: gitleaks (history + working tree)
        run: |
          GL_VERSION=8.30.1
          curl -sSL "https://github.com/gitleaks/gitleaks/releases/download/v${GL_VERSION}/gitleaks_${GL_VERSION}_linux_x64.tar.gz" -o gitleaks.tgz
          tar -xzf gitleaks.tgz gitleaks
          ./gitleaks git --redact --config .gitleaks.toml --exit-code 1 .
          ./gitleaks dir --redact --config .gitleaks.toml --exit-code 1 .

      - name: Set up Python (semgrep)
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'

      - name: semgrep
        run: |
          python -m pip install --quiet --disable-pip-version-check -r build/requirements-tools.txt
          semgrep scan --config p/csharp --config p/secrets --config p/github-actions \
            --error --quiet --metrics=off \
            --exclude artifacts --exclude node_modules --exclude .venv-tools --exclude temp .

      - name: jscpd
        run: npx --no-install jscpd --config .jscpd.json .

      - name: markdownlint
        run: npx --no-install markdownlint-cli2

      - name: actionlint
        uses: raven-actions/actionlint@3d39aea434753780c3b3d4a1a31c854b4dbf49d7 # v2.2.0
