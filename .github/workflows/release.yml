# Release pipeline for Open the Windows.
#
# Trigger: pushing a tag v* (e.g. v1.2.3), or a manual workflow_dispatch with the
# version. The job re-runs the correctness gates (restore, build, test, coverage
# thresholds) on the tagged commit — the full SAST/secret/lint suite already ran
# on that commit in ci.yml — then packages the release, generates build-provenance
# attestations for every asset (the compensating control for not code-signing,
# ADR 0003), publishes a GitHub Release with the CHANGELOG section as notes, and
# prints winget submission instructions in the job summary.
#
# Binaries are NOT code-signed. The SHA-256 sums, the SBOM and these attestations
# are the provenance. All third-party actions are pinned to a commit SHA.
name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version without the leading v (e.g. 1.2.3)'
        required: true
        type: string

permissions:
  contents: write # create the GitHub Release
  id-token: write # actions/attest-build-provenance
  attestations: write # actions/attest-build-provenance

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: true
  CI: true

jobs:
  release:
    name: Package and publish release
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Set up .NET (from global.json)
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json
          cache: true
          cache-dependency-path: '**/packages.lock.json'

      - name: Resolve version
        id: ver
        env:
          EVENT_NAME: ${{ github.event_name }}
          INPUT_VERSION: ${{ inputs.version }}
          REF_NAME: ${{ github.ref_name }}
        shell: pwsh
        run: |
          # Untrusted context (ref name, dispatch input) is read through env vars,
          # never interpolated into the script body, to avoid run-step injection.
          if ($env:EVENT_NAME -eq 'workflow_dispatch') {
            $v = $env:INPUT_VERSION
          }
          else {
            $v = $env:REF_NAME -replace '^v', ''
          }
          if ($v -notmatch '^\d+\.\d+\.\d+') { throw "Version '$v' is not major.minor.build." }
          "version=$v" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          Write-Host "Releasing version $v"

      - name: Restore (locked mode)
        run: dotnet restore OpenTheWindows.slnx --locked-mode

      - name: Restore dotnet tools
        run: dotnet tool restore

      - name: Build (Release)
        run: dotnet build OpenTheWindows.slnx -c Release --no-restore

      - name: Test with coverage
        run: >
          dotnet test OpenTheWindows.slnx -c Release --no-build
          --coverage --coverage-output-format cobertura --results-directory artifacts/coverage

      - name: Coverage thresholds
        run: >
          dotnet reportgenerator
          "-reports:artifacts/coverage/**/*.cobertura.xml"
          "-targetdir:artifacts/coverage/report"
          "-reporttypes:TextSummary"
          "-assemblyfilters:-*.Tests;-OpenTheWindows.TestSupport"
          "-classfilters:-OpenTheWindows.Windows.Writers.*;-OpenTheWindows.Windows.Interop.*;-OpenTheWindows.Windows.WindowsRestorePointService;-OpenTheWindows.Windows.WindowsExplorerRestarter;-OpenTheWindows.Windows.WindowsEventLogInstaller;-OpenTheWindows.Windows.Readers.WindowsMachineHealthProbe;-OpenTheWindows.App.Services.DialogService;-OpenTheWindows.App.Services.WpfDispatcherService;-OpenTheWindows.App.Services.ApplyFlowLauncher;-OpenTheWindows.App.Services.FileDialogService;-OpenTheWindows.App.Services.ThemeService"
          "-filefilters:-*.g.cs;-*.g.i.cs;-*.xaml.cs"
          "-verbosity:Warning"
          "minimumCoverageThresholds:lineCoverage=90"
          "minimumCoverageThresholds:branchCoverage=80"

      - name: Package (ZIPs + MSIs + SBOM + SHA256SUMS)
        run: pwsh build/package.ps1 -Version ${{ steps.ver.outputs.version }}

      - name: Generate winget manifest
        run: pwsh build/winget-manifest.ps1 -Version ${{ steps.ver.outputs.version }}

      - name: Attest build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            artifacts/publish/*.msi
            artifacts/publish/*.zip
            artifacts/publish/sbom.cdx.json

      - name: Extract release notes from CHANGELOG
        shell: pwsh
        run: |
          $version = '${{ steps.ver.outputs.version }}'
          $lines = Get-Content CHANGELOG.md
          $headings = @("## [$version]", '## [Unreleased]')
          $start = -1
          foreach ($h in $headings) {
            $start = ($lines | Select-String -SimpleMatch $h | Select-Object -First 1).LineNumber
            if ($start) { break }
          }
          if (-not $start) { throw "No CHANGELOG section for $version or [Unreleased]." }
          $body = New-Object System.Collections.Generic.List[string]
          for ($i = $start; $i -lt $lines.Count; $i++) {
            if ($lines[$i] -match '^## \[') { break }
            $body.Add($lines[$i])
          }
          $body -join "`n" | Out-File -FilePath release-notes.md -Encoding utf8
          Write-Host "Wrote release-notes.md ($($body.Count) lines)."

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: pwsh
        run: |
          $version = '${{ steps.ver.outputs.version }}'
          $tag = "v$version"
          $assets = Get-ChildItem artifacts/publish -File |
            Where-Object { $_.Extension -in '.msi', '.zip', '.txt', '.json' } |
            ForEach-Object { $_.FullName }
          $existing = gh release view $tag 2>$null
          if ($LASTEXITCODE -eq 0) {
            gh release upload $tag @assets --clobber
          }
          else {
            gh release create $tag @assets --title "Open the Windows $version" --notes-file release-notes.md
          }

      - name: winget submission instructions
        shell: pwsh
        run: |
          $version = '${{ steps.ver.outputs.version }}'
          $summary = @"
          ## winget submission (manual)

          The manifest for ``RandyNorthrup.OpenTheWindows`` $version is in
          ``packaging/winget`` (regenerated against the release assets). To submit it
          to the community repository:

          ``````
          winget validate --manifest packaging/winget
          wingetcreate submit --token <PAT> packaging/winget
          ``````

          Or open a pull request adding ``packaging/winget`` under
          ``manifests/r/RandyNorthrup/OpenTheWindows/$version`` in
          microsoft/winget-pkgs.
          "@
          $summary | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append
