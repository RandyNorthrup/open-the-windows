# Release pipeline for Open the Windows.
#
# Trigger: pushing a tag v* (e.g. v1.2.3). A manual workflow_dispatch (to retry a
# run that failed before publishing) must be started from that tag ("Use workflow
# from"), with the matching version: the release environment admits v* tags only.
# The job re-runs the correctness gates (restore, build, test, coverage thresholds)
# on the tagged commit — the full SAST/secret/lint suite already ran on that commit
# in ci.yml — then signs in to Azure with GitHub OIDC, packages the release with
# Authenticode signatures (Azure Artifact Signing, build/sign.ps1), generates
# build-provenance attestations for every asset, and publishes a GitHub Release with
# the CHANGELOG section as notes.
#
# No signing password, certificate or client secret is stored: Azure accepts this
# repository's OIDC token only from the release environment, and that identity may
# only sign with one certificate profile. All third-party actions are pinned to a
# commit SHA.
name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version without the leading v (e.g. 1.2.3)'
        required: true
        type: string

permissions:
  contents: write # create the GitHub Release
  id-token: write # azure/login (code signing) and actions/attest-build-provenance
  attestations: write # actions/attest-build-provenance

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: true
  CI: true

jobs:
  release:
    name: Package, sign and publish release
    runs-on: windows-latest
    timeout-minutes: 45
    # Azure trusts GitHub's OIDC token only from this environment, which only v*
    # tags can use.
    environment: release
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Set up .NET (from global.json)
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json
          cache: true
          cache-dependency-path: '**/packages.lock.json'

      - name: Resolve version
        id: ver
        env:
          EVENT_NAME: ${{ github.event_name }}
          INPUT_VERSION: ${{ inputs.version }}
          REF_NAME: ${{ github.ref_name }}
          REF_TYPE: ${{ github.ref_type }}
        shell: pwsh
        run: |
          # Untrusted context (ref name, dispatch input) is read through env vars,
          # never interpolated into the script body, to avoid run-step injection.
          if ($env:EVENT_NAME -eq 'workflow_dispatch') {
            $v = $env:INPUT_VERSION
          }
          else {
            $v = $env:REF_NAME -replace '^v', ''
          }
          # Anchored at both ends: the value is later used in file names and release titles.
          if ($v -notmatch '^\d+\.\d+\.\d+(-[0-9A-Za-z.]+)?$') { throw "Version '$v' is not major.minor.build[-prerelease]." }
          # The binaries are built and signed from the checked-out tag and the release is
          # created for tag v<version>: a dispatch must run from that same tag.
          if ($env:REF_TYPE -ne 'tag' -or $env:REF_NAME -ne "v$v") {
            throw "Version $v must be released from tag v$v; this run is on $env:REF_TYPE '$env:REF_NAME'."
          }
          "version=$v" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          Write-Host "Releasing version $v"

      - name: Restore (locked mode)
        run: dotnet restore OpenTheWindows.slnx --locked-mode

      - name: Restore dotnet tools
        run: dotnet tool restore

      - name: Build (Release)
        run: dotnet build OpenTheWindows.slnx -c Release --no-restore

      - name: Test with coverage
        run: >
          dotnet test OpenTheWindows.slnx -c Release --no-build
          --coverage --coverage-output-format cobertura --results-directory artifacts/coverage

      - name: Coverage thresholds
        run: >
          dotnet reportgenerator
          "-reports:artifacts/coverage/**/*.cobertura.xml"
          "-targetdir:artifacts/coverage/report"
          "-reporttypes:TextSummary"
          "-assemblyfilters:-*.Tests;-OpenTheWindows.TestSupport"
          "-classfilters:-OpenTheWindows.Windows.Writers.*;-OpenTheWindows.Windows.Interop.*;-OpenTheWindows.Windows.WindowsRestorePointService;-OpenTheWindows.Windows.WindowsExplorerRestarter;-OpenTheWindows.Windows.WindowsEventLogInstaller;-OpenTheWindows.Windows.Readers.WindowsMachineHealthProbe;-OpenTheWindows.App.Services.DialogService;-OpenTheWindows.App.Services.WpfDispatcherService;-OpenTheWindows.App.Services.ApplyFlowLauncher;-OpenTheWindows.App.Services.FileDialogService;-OpenTheWindows.App.Services.ThemeService"
          "-filefilters:-*.g.cs;-*.g.i.cs;-*.xaml.cs"
          "-verbosity:Warning"
          "minimumCoverageThresholds:lineCoverage=90"
          "minimumCoverageThresholds:branchCoverage=80"

      # Code signing with Azure Artifact Signing under the maintainer's validated
      # identity (CN=Randy Northrup), certificate profile SAKUtility. Signing in comes
      # after restore, build and test, and directly before packaging: the GitHub token
      # azure/login exchanges is short-lived, so package.ps1 -Sign requests the
      # code-signing token first (build/sign.ps1 -CheckAccess), before it publishes.
      - name: Sign in to Azure for code signing
        uses: azure/login@a641126d1b8aa4d1fa005f4f92df94a3a4c4c906 # v3.1.0
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          allow-no-subscriptions: true

      # Signs otw.exe, OpenTheWindows.exe and the OpenTheWindows assemblies before
      # they are zipped or packed into an MSI, then the MSIs; each signature is
      # verified (signtool verify /pa, timestamp, publisher) before the sums are written.
      - name: Package and sign (ZIPs + MSIs + SBOM + SHA256SUMS)
        env:
          VERSION: ${{ steps.ver.outputs.version }}
        shell: pwsh
        run: pwsh build/package.ps1 -Version $env:VERSION -Sign

      - name: Attest build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            artifacts/publish/*.msi
            artifacts/publish/*.zip
            artifacts/publish/sbom.cdx.json

      - name: Extract release notes from CHANGELOG
        env:
          VERSION: ${{ steps.ver.outputs.version }}
        shell: pwsh
        run: |
          $version = $env:VERSION
          $lines = Get-Content CHANGELOG.md
          $headings = @("## [$version]", '## [Unreleased]')
          $start = -1
          foreach ($h in $headings) {
            $start = ($lines | Select-String -SimpleMatch $h | Select-Object -First 1).LineNumber
            if ($start) { break }
          }
          if (-not $start) { throw "No CHANGELOG section for $version or [Unreleased]." }
          $body = New-Object System.Collections.Generic.List[string]
          for ($i = $start; $i -lt $lines.Count; $i++) {
            if ($lines[$i] -match '^## \[') { break }
            $body.Add($lines[$i])
          }
          $body -join "`n" | Out-File -FilePath release-notes.md -Encoding utf8
          Write-Host "Wrote release-notes.md ($($body.Count) lines)."

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.ver.outputs.version }}
        shell: pwsh
        run: |
          $version = $env:VERSION
          $tag = "v$version"
          $assets = Get-ChildItem artifacts/publish -File |
            Where-Object { $_.Extension -in '.msi', '.zip', '.txt', '.json' } |
            ForEach-Object { $_.FullName }
          $existing = gh release view $tag 2>$null
          if ($LASTEXITCODE -eq 0) {
            gh release upload $tag @assets --clobber
          }
          else {
            gh release create $tag @assets --title "Open the Windows $version" --notes-file release-notes.md
          }
