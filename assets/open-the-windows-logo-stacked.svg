<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1400" viewBox="0 0 1200 1400" role="img">
      <title>Open the Windows logo</title>
      
    <defs>
      <linearGradient id="logo-bg" x1="0" y1="0" x2="1" y2="1">
        <stop offset="0" stop-color="#07172C"/>
        <stop offset="0.52" stop-color="#0B427E"/>
        <stop offset="1" stop-color="#0878D1"/>
      </linearGradient>
      <radialGradient id="logo-glow" cx="0.18" cy="0.12" r="0.95">
        <stop offset="0" stop-color="#65DFFF" stop-opacity="0.28"/>
        <stop offset="0.55" stop-color="#65DFFF" stop-opacity="0.05"/>
        <stop offset="1" stop-color="#65DFFF" stop-opacity="0"/>
      </radialGradient>
      <linearGradient id="logo-pane" x1="0" y1="0" x2="0.8" y2="1">
        <stop offset="0" stop-color="#FFFFFF"/>
        <stop offset="1" stop-color="#DFF5FF"/>
      </linearGradient>
      <linearGradient id="logo-open" x1="0" y1="0" x2="1" y2="1">
        <stop offset="0" stop-color="#80E7FF"/>
        <stop offset="1" stop-color="#22A8F2"/>
      </linearGradient>
      <filter id="logo-shadow" x="-30%" y="-30%" width="160%" height="170%">
        <feDropShadow dx="0" dy="25" stdDeviation="24" flood-color="#020C18" flood-opacity="0.34"/>
      </filter>
      <filter id="logo-pane-shadow" x="-25%" y="-25%" width="150%" height="170%">
        <feDropShadow dx="0" dy="14" stdDeviation="13" flood-color="#031023" flood-opacity="0.24"/>
      </filter>
      <clipPath id="logo-clip">
        <rect x="32" y="32" width="960" height="960" rx="220"/>
      </clipPath>
    </defs>
      <g transform="translate(280 70) scale(0.625)">
      
        <g filter="url(#logo-shadow)">
          <rect x="32" y="32" width="960" height="960" rx="220" fill="url(#logo-bg)"/>
        </g>
        <g clip-path="url(#logo-clip)">
          <rect x="32" y="32" width="960" height="960" rx="220" fill="url(#logo-glow)"/>
          <path d="M-20 760 C240 510 430 530 612 393 C786 262 844 86 1055 -10 L1055 1034 L-20 1034 Z"
                fill="#021327" opacity="0.12"/>
          <path d="M98 155 C300 43 529 44 722 135" fill="none" stroke="#FFFFFF" stroke-width="18" stroke-linecap="round" opacity="0.08"/>
        </g>
      <g filter="url(#logo-pane-shadow)">
        <!-- Three stable panes -->
        <rect x="202" y="230" width="264" height="244" rx="38" fill="url(#logo-pane)"/>
        <rect x="202" y="522" width="264" height="244" rx="38" fill="url(#logo-pane)"/>
        <rect x="516" y="522" width="264" height="244" rx="38" fill="url(#logo-pane)"/>
        <!-- The fourth pane opens outward, giving the mark its own silhouette -->
        <path d="M516 255 Q516 227 543 221 L757 178 Q789 172 798 203 L846 433 Q853 466 820 474 L547 485 Q516 486 516 455 Z"
              fill="url(#logo-open)" stroke="#EAF8FF" stroke-width="18" stroke-linejoin="round"/>
        
          <!-- hinge details: subtle at large sizes, absent from the favicon silhouette -->
          <rect x="505" y="275" width="23" height="58" rx="11.5" fill="#F4FCFF" opacity="0.72"/>
          <rect x="505" y="382" width="23" height="58" rx="11.5" fill="#F4FCFF" opacity="0.72"/>
          <circle cx="776" cy="333" r="18" fill="#0A376A" opacity="0.62"/>
          <circle cx="776" cy="333" r="7" fill="#F8FBFF" opacity="0.95"/>
      </g></g>
      <text x="600" y="860" text-anchor="middle"
            font-family="Inter, Segoe UI, Arial, sans-serif" font-size="102"
            fill="#101D2E" letter-spacing="-3"><tspan font-weight="520">Open the </tspan><tspan font-weight="760">Windows</tspan></text>
      <text x="600" y="946" text-anchor="middle"
            font-family="Inter, Segoe UI, Arial, sans-serif" font-size="30"
            font-weight="650" fill="#526579" letter-spacing="6">WINDOWS 11 CONTROL PANEL</text>
    </svg>